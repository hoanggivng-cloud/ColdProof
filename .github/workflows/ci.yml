name: Foundation CI
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://coldproof:ci_only@localhost:5432/coldproof
      NEXT_TELEMETRY_DISABLED: 1
    services:
      postgres:
        image: postgres:16.11-alpine
        env:
          POSTGRES_USER: coldproof
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: coldproof
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coldproof"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
